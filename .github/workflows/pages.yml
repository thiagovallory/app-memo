# Publica a versão web (PWA) no GitHub Pages: https://<usuário>.github.io/<repositório>/
# Para ativar: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Publicar PWA

on:
  push:
    branches: [main]
    paths: ['src/renderer/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/renderer
      - id: deployment
        uses: actions/deploy-pages@v4
